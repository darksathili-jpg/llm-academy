name: Validate and publish LLM Academy
on:
  push:
    branches: [main, 'refonte/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run editorial:check
      - run: python3 scripts/verify-teacher-courses.py
      - run: npm run typecheck
      - run: npm test
      - run: python3 scripts/verify-nsi-challenges.py
      - run: npm run build
      - name: Verify compiled artifact for /llm-academy/
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/llm-academy/assets/' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'ERROR: uncompiled TypeScript entry point in Pages artifact'
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/refonte/qualification-pedagogique-v4')
    needs: verify
    timeout-minutes: 18
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Deploy validated Vite application from dist/
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the public site with Chromium after deployment
        run: node scripts/verify-live-pages.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
