name: Temporary Prettier V4 final pass
on:
  push:
    branches: [refonte/qualification-pedagogique-v4]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/v2/TeacherSequencePage.tsx tests/e2e/v4.spec.ts docs/AUDIT_PEDAGOGIQUE_V4.md
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/v2/TeacherSequencePage.tsx tests/e2e/v4.spec.ts docs/AUDIT_PEDAGOGIQUE_V4.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: format V4 final quality corrections"
            git push origin HEAD:refonte/qualification-pedagogique-v4
          fi
