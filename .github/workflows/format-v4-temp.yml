name: Temporary Prettier qualification V4
on:
  push:
    branches: [refonte/qualification-pedagogique-v4]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format V4 changed files
        run: |
          npx prettier --write src/content/activities.ts src/content/nsiChallenges.ts src/content/learningPath.ts src/content/scenarios.ts src/content/teacherSequences.ts src/components/v2/Workshop.tsx src/components/v2/TeacherGuide.tsx src/components/v2/TeacherSequencePage.tsx src/App.tsx src/v2.css tests/unit/nsi-pedagogy.test.ts tests/e2e/v4.spec.ts docs/AUDIT_PEDAGOGIQUE_V4.md README.md
      - name: Commit only formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/activities.ts src/content/nsiChallenges.ts src/content/learningPath.ts src/content/scenarios.ts src/content/teacherSequences.ts src/components/v2/Workshop.tsx src/components/v2/TeacherGuide.tsx src/components/v2/TeacherSequencePage.tsx src/App.tsx src/v2.css tests/unit/nsi-pedagogy.test.ts tests/e2e/v4.spec.ts docs/AUDIT_PEDAGOGIQUE_V4.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: format pedagogical qualification V4"
            git push origin HEAD:refonte/qualification-pedagogique-v4
          fi
