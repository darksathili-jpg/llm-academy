name: Temporary editorial Prettier V5
on:
  push:
    branches: [refonte/v5-cours-enseignant]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write AGENTS.md docs/CHARTE_EDITORIALE_FR_NSI_V5.md docs/formation-enseignant/MODULE_01_MODELES_LANGAGE.md docs/formation-enseignant/MODULE_02_TOKENISATION_GENERATION.md scripts/check-editorial-v5.mjs package.json .github/workflows/pages.yml .github/workflows/editorial-format-temp.yml
      - name: Commit format corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/CHARTE_EDITORIALE_FR_NSI_V5.md docs/formation-enseignant/MODULE_01_MODELES_LANGAGE.md docs/formation-enseignant/MODULE_02_TOKENISATION_GENERATION.md scripts/check-editorial-v5.mjs package.json .github/workflows/pages.yml .github/workflows/editorial-format-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(v5): format rigorously edited French courses"
            git push origin HEAD:refonte/v5-cours-enseignant
          fi
