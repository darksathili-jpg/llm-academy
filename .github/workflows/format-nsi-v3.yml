name: Temporary formatting for NSI V3
on:
  push:
    branches: [refonte/nsi-pedagogie-v3]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/REFONTE_NSI_V3.md src/components/ModulePage.tsx src/components/Notebook.tsx
      - name: Commit formatted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REFONTE_NSI_V3.md src/components/ModulePage.tsx src/components/Notebook.tsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: format follow-up NSI V3"
            git push origin HEAD:refonte/nsi-pedagogie-v3
          fi
