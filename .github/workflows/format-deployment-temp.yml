name: Temporary format production deployment
on:
  push:
    branches: [refonte/qualification-pedagogique-v4]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-live-pages.mjs .github/workflows/pages.yml .github/workflows/format-deployment-temp.yml
      - name: Commit Prettier changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-live-pages.mjs .github/workflows/pages.yml .github/workflows/format-deployment-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: format deployment workflow and live smoke test"
            git push origin HEAD:refonte/qualification-pedagogique-v4
          fi
