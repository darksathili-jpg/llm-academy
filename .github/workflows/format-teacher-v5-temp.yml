name: Temporary formatting V5 trainer curriculum
on:
  push:
    branches: [refonte/v5-cours-enseignant]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the new V5 trainer curriculum
        run: |
          npx prettier --write docs/formation-enseignant/MODULE_03_APPRENTISSAGE_EVALUATION.md docs/formation-enseignant/MODULE_04_FIABILITE_SOURCES_RAG.md docs/formation-enseignant/README.md scripts/check-editorial-v5.mjs .github/workflows/pages.yml README.md .github/workflows/format-teacher-v5-temp.yml
      - name: Commit formatted documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/formation-enseignant/MODULE_03_APPRENTISSAGE_EVALUATION.md docs/formation-enseignant/MODULE_04_FIABILITE_SOURCES_RAG.md docs/formation-enseignant/README.md scripts/check-editorial-v5.mjs .github/workflows/pages.yml README.md .github/workflows/format-teacher-v5-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(v5): format trainer courses and supporting checks"
            git push origin HEAD:refonte/v5-cours-enseignant
          fi
